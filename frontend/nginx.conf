server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API ke backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 20M;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (/assets/index-*.js, *.css) — nama file berubah tiap build,
    # jadi aman di-cache panjang. ^~ supaya menang atas regex gambar di bawah.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker & manifest — WAJIB selalu revalidate (mekanisme update PWA).
    location = /sw.js                 { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /registerSW.js        { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Ikon & gambar root — cache sedang
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback: index.html + semua route — JANGAN cache, supaya tiap deploy
    # client langsung ambil referensi bundle terbaru (no stale index.html).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
